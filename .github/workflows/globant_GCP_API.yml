name: globant_GCP_API

on:
  push:
    branches:
      - main

env:
  REGION: us-central1
  REPO_NAME: globant-repo
  SERVICE_NAME: globant-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Google Auth
      id: auth
      uses: google-github-actions/auth@v2
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Create Artifact Registry Repository (if not exists)
      run: |-
        gcloud artifacts repositories describe ${{ env.REPO_NAME }} \
          --location=${{ env.REGION }} || \
        gcloud artifacts repositories create ${{ env.REPO_NAME }} \
          --repository-format=docker \
          --location=${{ env.REGION }} \
          --description="Repositorio para Globant Data Engineering API"

    - name: Docker Auth
      run: |-
        gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push Docker Image
      run: |-
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG

    - name: Deploy to Cloud Run
      run: |-
        IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
        gcloud run deploy ${{ env.SERVICE_NAME }} \
          --image $IMAGE_TAG \
          --region ${{ env.REGION }} \
          --platform managed \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --set-env-vars DATABASE_URL="${{ secrets.DATABASE_URL }}"